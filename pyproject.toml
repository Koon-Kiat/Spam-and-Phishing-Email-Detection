[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-and-phishing-detection"
version = "1.0.0"
description = "Leakage-safe spam and phishing email training and inference workflow"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4==4.15.0",
  "datasketch==2.0.0",
  "Flask==3.1.3",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "tldextract==5.4.0"
]

[project.optional-dependencies]
transformer = [
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "torch==2.15.0",
  "transformers==5.22.1"
]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.17.4"
]

[project.scripts]
spam-phishing = "spamandphishingdetection.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: full-data or transformer tests"
]

[tool.ruff]
line-length = 100
# Ruff 0.16 supports a py315 target only in preview mode. The code base uses no
# 3.15-only syntax, so lint against the stable 3.14 rule set until that changes.
target-version = "py314"
extend-exclude = [
  ".cache",
  ".tools",
  ".venv",
  "artifacts",
  "reports"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
